name: leelando_video_fvp
description: 基于 FVP 和 libmdk 的 leelando_video 可插拔播放内核，覆盖移动端与桌面端的统一视频播放场景。
version: 1.0.1
resolution: workspace
repository: https://github.com/LeelandoAi/Flutter_Video/tree/main/packages/leelando_video_fvp
issue_tracker: https://github.com/LeelandoAi/Flutter_Video/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  leelando_video: ^1.0.1
  fvp: ^0.38.1
  video_player: ^2.14.0
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leelando_video_video_player: ^1.0.1
