name: leelando_video_video_player
description: 基于 Flutter 官方 video_player 的 leelando_video 可插拔播放内核，支持移动端和 macOS 的常用视频播放场景。
version: 1.0.0
resolution: workspace
repository: https://github.com/LeelandoAi/Flutter_Video/tree/main/packages/leelando_video_video_player
issue_tracker: https://github.com/LeelandoAi/Flutter_Video/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  leelando_video: ^1.0.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
