name: lee_video_media_kit
description: 基于 MediaKit 和 libmpv 的 lee_video 可插拔播放内核，覆盖移动端与桌面端的统一视频播放场景。
version: 0.2.0
resolution: workspace
repository: https://github.com/LeelandoAi/Flutter_Video/tree/main/packages/lee_video_media_kit
issue_tracker: https://github.com/LeelandoAi/Flutter_Video/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  lee_video: ^0.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lee_video_erika: ^0.2.0
  lee_video_fvp: ^0.2.0
  lee_video_video_player: ^0.2.0
