name: lee_video
description: 面向 Flutter 的可插拔统一影视播放器核心，提供跨平台播放协议、统一状态控制器和播放器 UI，由应用按需安装并注册具体播放内核。
version: 0.2.0
repository: https://github.com/LeelandoAi/Flutter_Video
issue_tracker: https://github.com/LeelandoAi/Flutter_Video/issues

topics:
  - video
  - video-player
  - media
  - multimedia
  - cross-platform

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.leelandoai.lee_video
        pluginClass: LeeVideoPlugin
      ios:
        pluginClass: LeeVideoPlugin
      macos:
        pluginClass: LeeVideoPlugin
      windows:
        pluginClass: LeeVideoPluginCApi

workspace:
  - packages/lee_video_erika
  - packages/lee_video_fvp
  - packages/lee_video_media_kit
  - packages/lee_video_video_player
  - example
