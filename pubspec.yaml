name: lee_video
description: A unified multi-kernel Flutter video player for Android, iOS, macOS, and Windows.
version: 0.1.0
repository: https://github.com/LeelandoAi/Flutter_Video
issue_tracker: https://github.com/LeelandoAi/Flutter_Video/issues

topics:
  - video
  - video-player
  - media
  - multimedia
  - cross-platform

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.14.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  fvp: ^0.38.1
  erika_flutter: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.leelandoai.lee_video
        pluginClass: LeeVideoPlugin
      ios:
        pluginClass: LeeVideoPlugin
      macos:
        pluginClass: LeeVideoPlugin
      windows:
        pluginClass: LeeVideoPluginCApi
